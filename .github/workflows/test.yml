name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y luajit gettext

      # Every module is loaded by the harness, but this catches one that has been
      # added and not wired in yet.
      - name: Check every module compiles
        run: |
          set -eu
          for file in *.lua spec/*.lua; do
            luajit -b "$file" /dev/null
          done

      # Only the exporter stores a switch in KOReader's settings. The note
      # dialog reads KOReader's keyboard preference to match native text input.
      - name: Check global settings access stays in the exporter and note dialog
        run: |
          set -eu
          if grep -l "G_reader_settings" *.lua | grep -Ev "^neodb_(exporter|notedialog).lua$"; then
            echo "G_reader_settings used outside exporter or note dialog" >&2
            exit 1
          fi

      - name: Check generated translations
        run: python3 scripts/build-translations.py --check

      - name: Run the harnesses
        run: ./spec/run.sh
